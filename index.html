<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom's Notes</title>
<style>
  :root {
    --bg: #14213d;
    --panel: #ffffff;
    --time: #EED9C4;
    --date: #d9e2f2;
    --alert: #e63946;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: Verdana, Arial, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  #clock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 1.2vh 24px 0.8vh;
  }
  #datetime { text-align: left; }
  #weather {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: right;
  }
  #wx-icon { font-size: clamp(3.5rem, 11vh, 6.5rem); line-height: 1; }
  #wx-temp {
    font-size: clamp(2.5rem, 8vh, 5rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--time);
  }
  #wx-detail {
    font-size: clamp(1.1rem, 3.2vh, 2rem);
    color: var(--date);
    white-space: pre-line;
  }
  #wx-note { font-size: 0.95rem; color: var(--date); opacity: 0.7; margin-top: 2px; }
  #time {
    font-size: clamp(3.5rem, 11vh, 7rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--time);
  }
  #date {
    font-size: clamp(1.4rem, 4.5vh, 2.6rem);
    color: var(--date);
    margin-top: 0.4vh;
  }

  #columns {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
    padding: 12px 16px 16px;
  }
 .column { min-width: 0; display: flex; flex-direction: column; }
 .column:nth-child(1) { flex: 4; }
 .column:nth-child(2) { flex: 6; }
  .column h2 {
    display: none;                 /* set SHOW_HEADINGS to true in the script to use these */
    margin: 0 0 8px;
    font-size: 2rem;
  }
  body.headings .column h2 { display: block; }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    border-radius: 14px;
    background: var(--panel);
  }

  #offline {
    display: none;
    background: var(--alert);
    color: #fff;
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    padding: 10px;
  }
  body.offline #offline { display: block; }
</style>
</head>
<body>

<div id="offline">No internet connection. The information below may be out of date.</div>

<div id="clock">
  <div id="datetime">
    <div id="time"></div>
    <div id="date"></div>
  </div>
  <div id="weather">
    <div id="wx-icon"></div>
    <div id="wx-text">
      <div id="wx-temp"></div>
      <div id="wx-detail"></div>
      <div id="wx-note"></div>
    </div>
  </div>
</div>

<div id="columns">
  <div class="column">
    <div style="
      width: 100%;
      padding: 16px 0;
      background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
      color: white;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 60px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 14px 14px 0 0;
    ">
      Where's Connie? 📌
    </div>
    <iframe id="left" title="Where’s Connie?"></iframe>
  </div>
  <div class="column">
     <div style="
      width: 100%;
      padding: 16px 0;
      background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
      color: white;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 60px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 14px 14px 0 0;
    ">
      ✨ What's Happening? ✨
    </div>
    <iframe id="right" title="What's Happening?"></iframe>
  </div>
</div>

<script>
  // ===== SETTINGS =====
  const LEFT_URL  = "https://docs.google.com/document/d/e/2PACX-1vR4ipm0bZVMHNFgXDuihGEJv3JjLVQK6ttk0zK6Pxz42TML0kbN108kI3k_gElzxf9fZ9345ZHLojyO/pub?embedded=true";
  const RIGHT_URL = "https://docs.google.com/document/d/e/2PACX-1vQSnuyBwvL9itMqWswuGDcvP8SxDWwyLZzQcXFIqz7iZKMXmHyA-lCWWX3agXvFn2M6ICrjKWWOoNeW/pub?embedded=true";

  // Time zone for the clock, for example "America/New_York", "America/Chicago",
  // "America/Denver" or "America/Los_Angeles". Leave "" to use the tablet's own setting.
  const TIME_ZONE = "";

  // Set to true if the titles are NOT already inside the Google Docs.
  const SHOW_HEADINGS = false;

  // How often the two documents are reloaded, in minutes.
  const REFRESH_MINUTES = 1;

  // Weather location. Find latitude and longitude by searching the town on Google Maps,
  // right-clicking the spot, and clicking the two numbers at the top of the menu.
  // Example: const LATITUDE = 41.88; const LONGITUDE = -87.63;
  const LATITUDE  = 47.47;
  const LONGITUDE = -117.40;
  const PLACE_NAME = "Spangle, WA";            // shown in small text under the weather, e.g. "Springfield"
  const TEMP_UNIT = "fahrenheit";   // or "celsius"
  const WEATHER_REFRESH_MINUTES = 15;

  // ===== CLOCK =====
  // If TIME_ZONE is blank, the weather location's time zone is used once weather loads;
  // until then (or if no location is set) the tablet's own setting is used.
  let clockZone = TIME_ZONE;
  function updateClock() {
    const tz = clockZone ? { timeZone: clockZone } : {};
    const now = new Date();
    document.getElementById("time").textContent =
      now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", ...tz });
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric", ...tz });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== DOCUMENTS =====
  function loadDocs() {
    document.getElementById("left").src = LEFT_URL;
    document.getElementById("right").src = RIGHT_URL;
  }
  loadDocs();
  setInterval(loadDocs, REFRESH_MINUTES * 60 * 1000);

  // ===== WEATHER (Open-Meteo, free, no account needed) =====
  const WEATHER_CODES = {
    0: ["Clear", "☀️"], 1: ["Mostly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Cloudy", "☁️"],
    45: ["Foggy", "🌫️"], 48: ["Foggy", "🌫️"],
    51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
    56: ["Freezing drizzle", "🌧️"], 57: ["Freezing drizzle", "🌧️"],
    61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
    66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"],
    71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"], 77: ["Snow grains", "❄️"],
    80: ["Light showers", "🌦️"], 81: ["Showers", "🌧️"], 82: ["Heavy showers", "🌧️"],
    85: ["Snow showers", "🌨️"], 86: ["Heavy snow showers", "🌨️"],
    95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"]
  };

  async function loadWeather() {
    const detail = document.getElementById("wx-detail");
    const note = document.getElementById("wx-note");
    if (LATITUDE === null || LONGITUDE === null) {
      detail.textContent = "Weather is off. Set LATITUDE and LONGITUDE in index.html.";
      return;
    }
    const url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + LATITUDE + "&longitude=" + LONGITUDE +
      "&current=temperature_2m,weather_code,is_day" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&temperature_unit=" + TEMP_UNIT + "&timezone=auto&forecast_days=1";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      if (!TIME_ZONE && data.timezone) { clockZone = data.timezone; updateClock(); }

      const code = data.current.weather_code;
      const info = WEATHER_CODES[code] || ["", "🌡️"];
      const icon = (code === 0 && data.current.is_day === 0) ? "🌙" : info[1];
      const hi = Math.round(data.daily.temperature_2m_max[0]);
      const lo = Math.round(data.daily.temperature_2m_min[0]);
      const rain = data.daily.precipitation_probability_max[0];

      document.getElementById("wx-icon").textContent = icon;
      document.getElementById("wx-temp").textContent = Math.round(data.current.temperature_2m) + "°";
      detail.textContent = info[0] + "\nHigh " + hi + "° · Low " + lo + "°" +
        (rain !== null && rain !== undefined ? " · Rain " + rain + "%" : "");

      const tz = clockZone ? { timeZone: clockZone } : {};
      const updated = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", ...tz });
      note.textContent = (PLACE_NAME ? PLACE_NAME + " · " : "") + "Updated " + updated;
    } catch (e) {
      console.error("Weather failed:", e);
      note.textContent = "Weather not updated. Showing the last reading.";
    }
  }
  loadWeather();
  setInterval(loadWeather, WEATHER_REFRESH_MINUTES * 60 * 1000);

  // ===== OFFLINE BANNER =====
  function updateOnline() {
    document.body.classList.toggle("offline", !navigator.onLine);
    if (navigator.onLine) { loadDocs(); loadWeather(); }
  }
  window.addEventListener("online", updateOnline);
  window.addEventListener("offline", updateOnline);
  updateOnline();

  if (SHOW_HEADINGS) document.body.classList.add("headings");
</script>
</body>
</html>
